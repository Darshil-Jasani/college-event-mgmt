name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compute artifact version
        id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build, unit & integration tests
        run: mvn -B -Drevision=${{ steps.ver.outputs.version }} verify
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
      - name: Upload versioned JAR
        uses: actions/upload-artifact@v4
        with:
          name: college-event-mgmt-${{ steps.ver.outputs.version }}
          path: target/college-event-mgmt.jar

  security-scan-source:
    name: Dependency & secret scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  docker:
    name: Docker build, scan & push
    needs: [build-test, security-scan-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ needs.build-test.outputs.version }}
          tags: scan-target:${{ needs.build-test.outputs.version }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ needs.build-test.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push versioned image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ needs.build-test.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    if: false 
    needs: [build-test, docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Apply manifests and roll out new image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.version }}
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/postgres.yaml -f k8s/service.yaml -f k8s/hpa.yaml -f k8s/ingress.yaml
          sed -i "s|image: .*college-event-mgmt:.*|image: $IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
      - name: Wait for rollout (auto-rollback on failure)
        run: |
          kubectl -n college-events rollout status deployment/college-event-mgmt --timeout=180s \
            || { kubectl -n college-events rollout undo deployment/college-event-mgmt; exit 1; }
