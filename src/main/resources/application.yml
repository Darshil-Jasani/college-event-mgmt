server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: college-event-mgmt
  datasource:
    # Defaults to in-memory H2 for local runs; Docker/K8s override via env vars (PostgreSQL)
    url: ${DB_URL:jdbc:h2:mem:events;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  users:
    admin-password: ${ADMIN_PASSWORD:admin123}
    organizer-password: ${ORGANIZER_PASSWORD:organizer123}
    student-password: ${STUDENT_PASSWORD:student123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} level=%p app=college-event-mgmt thread=%t logger=%logger{36} msg=\"%m\"%n"
  level:
    root: INFO
    com.college.events: ${LOG_LEVEL:INFO}
